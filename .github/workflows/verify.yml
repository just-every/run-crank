name: Verify
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seed-verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check > /dev/null
      - id: reuse
        run: node scripts/verify-plan.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: matrix
        run: echo "matrix=$(node scripts/verify-ci.mjs --matrix push)" >> "$GITHUB_OUTPUT"
  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Build once and check the edition
        run: node scripts/verify-ci.mjs --build
      - run: tar -czf /tmp/crank-build.tar.gz dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crank-build
          path: /tmp/crank-build.tar.gz
          retention-days: 1
  shard:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CRANK_EVIDENCE: artifacts/${{ matrix.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix gateways/node --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: crank-build
          path: /tmp
      - run: tar -xzf /tmp/crank-build.tar.gz
      - name: Install Chromium with a launch probe
        if: matrix.browser
        run: |
          pnpm exec playwright install chromium
          if ! node --input-type=module -e 'import {chromium} from "@playwright/test"; const browser=await chromium.launch({headless:true}); await browser.close()'; then
            pnpm exec playwright install-deps chromium
          fi
      - name: Prepare the Linux executor
        if: matrix.name == 'agent-executor'
        run: |
          if ! command -v bwrap; then sudo apt-get update && sudo apt-get install -y bubblewrap; fi
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run selected assertions
        run: node scripts/verify-ci.mjs '${{ matrix.name }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.browser
        with:
          name: browser-evidence-${{ matrix.name }}
          path: artifacts
          if-no-files-found: ignore
  verify:
    if: always()
    needs: [plan, build, shard]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every selected gate
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          BUILD: ${{ needs.build.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then
            test "$BUILD" = skipped && test "$SHARDS" = skipped
          else
            test "$BUILD" = success && test "$SHARDS" = success
          fi
