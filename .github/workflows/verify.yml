name: Verify

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Check first-party contract
        run: pnpm exec rer check --profile first-party
      - name: Check edition source lock freshness
        run: node scripts/edition-authoring/cli.mjs check
      - name: Build application and run site once
        run: |
          pnpm run build
          pnpm exec rer build --site
          printf '%s\n' "$GITHUB_SHA" > dist/.ci-sha
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verify-build
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  shards:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CRANK_TEST_SHARD: ${{ matrix.shard }}/4
      CRANK_CI_PREBUILT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; action runtime Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; action runtime Node 24
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verify-build
          path: dist
      - run: npm ci --prefix gateways/node --ignore-scripts
      - run: pnpm run verify

  agent-journeys:
    needs: [plan, build]
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Last green test steps: decisions 250s + invoice-outcome 62s.
          - group: decisions
            journeys: invoice-outcome
          # Last green test steps: 40s + 15s + 43s + 26s = 124s.
          - group: agents
            journeys: drift mcp-client migration authoring
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verify-build
          path: dist
      - name: Owner browser journeys
        env:
          JOURNEYS: ${{ matrix.journeys }}
        run: |
          failed=0
          for journey in $JOURNEYS; do
            CRANK_EVIDENCE="artifacts/$journey" pnpm exec node "tests/$journey-browser.mjs" || failed=1
          done
          exit "$failed"
      - name: Owner decisions
        if: ${{ !cancelled() && matrix.group == 'decisions' }}
        env:
          CRANK_EVIDENCE: artifacts/decisions
        run: pnpm exec node tests/decision-browser.mjs
      - name: Executor schema browser journey
        if: ${{ !cancelled() && matrix.group == 'decisions' }}
        env:
          CRANK_EVIDENCE: artifacts/decisions
        run: pnpm exec node tests/executor-schema-browser.mjs
      - name: Financial owner browser journeys
        if: ${{ !cancelled() && matrix.group == 'decisions' }}
        env:
          CRANK_EVIDENCE: artifacts/decisions/financial
        run: pnpm exec node tests/financial-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: agent-browser-evidence-${{ matrix.group }}
          path: artifacts
          if-no-files-found: ignore

  linux-executor:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          package-manager-cache: false
      - run: npm install --global pnpm@10.12.4
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # This disposable VM enables the kernel feature required by the Linux executor.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Root stages fixtures; every executor job runs as the separate nobody user.
      - run: sudo "$(command -v node)" tests/executor-linux.mjs

  verify:
    needs: [plan, build, shards, agent-journeys, linux-executor]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
